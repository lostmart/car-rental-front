<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700;900&display=swap"
			rel="stylesheet"
		/>
		<title>Classic cars rentals</title>
		<script>
			// Chakra UI ColorModeScript - prevents flash of wrong theme
			(function () {
				const storageKey = "chakra-ui-color-mode"
				const classNames = { light: "", dark: "chakra-ui-dark" }
				function setColorMode(mode) {
					const className = classNames[mode]
					const root = document.documentElement
					if (className) {
						root.classList.add(className)
					}
				}
				try {
					const persistedMode = localStorage.getItem(storageKey)
					const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
					const mode = persistedMode || (prefersDark ? "dark" : "light")
					setColorMode(mode)
				} catch (e) {
					// Handle localStorage access errors
					setColorMode("light")
				}
			})()
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
